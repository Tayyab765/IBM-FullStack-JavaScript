<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="h-screen flex items-center justify-center">
    <div class="bg-taupe-100 p-10 rounded-2xl sha">
      <div class="text-center text-4xl">Login</div>
      <div>
        <div class="flex gap-3 mt-5">
          <div>👤</div>
          <div>User ID</div>
        </div>
        <input
          id="user_id"
          type="text"
          placeholder="Enter Username"
          class="border mt-2 rounded-sm"
        />
      </div>
      <div>
        <div class="flex gap-3 mt-5">
          <div>🔒</div>
          <div>Password</div>
        </div>
        <input
          id="password"
          type="Password"
          placeholder="Enter Password"
          class="border mt-2 rounded-sm"
        />
      </div>
      <div
        id="submit"
        class="bg-blue-400 p-2 justify-center mt-5 rounded-md cursor-pointer"
      >
        Submit
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
