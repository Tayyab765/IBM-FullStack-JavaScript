<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Number Generator</title>

    <link rel="stylesheet" href="./src/output.css" />
  </head>

  <body
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">

    <div
      class="bg-white/20 backdrop-blur-lg border border-white/30 rounded-3xl shadow-2xl p-10 w-96 text-center">

      <h1 class="text-3xl font-bold text-white mb-8">
        🎲 Random Number Generator
      </h1>

      <!-- Circle where the random number appears -->
      <div
        id="random_number_text"
        class="w-40 h-40 mx-auto rounded-full bg-white flex items-center justify-center text-6xl font-extrabold text-indigo-600 shadow-xl">
        54
      </div>

      <!-- Button -->
      <button
        id="random_number_button"
        class="mt-8 bg-white text-indigo-600 font-semibold px-8 py-3 rounded-full shadow-lg hover:bg-indigo-600 hover:text-white transition-all duration-300 hover:scale-105 active:scale-95">
        Generate Number
      </button>

    </div>

    <script src="./script.js"></script>
  </body>
</html>
